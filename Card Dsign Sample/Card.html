<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    .card {

        width: 300px;
        height: 435px;
        border: 2px solid rgb(187, 186, 186);
        border-radius: 10px;
        margin: 0px;
        padding: 7px;
    }

    .image {
        margin-bottom: 2px;
        border-radius: 5px;
        width: 100%;

    }

    img {
        border-radius: 10px;
        height: auto;
    }



    .head {
        margin-top: 0px;
        font-size: 24px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        color: rgb(49, 56, 63);
    }



    .inline {
        display: inline-block;
        border: 1px solid rgba(128, 128, 128, 0.349);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 14px;
        margin-right: 6px;
        margin-top: 10px;
        margin-bottom: 10px;

    }

    .tag {
        margin: 0px;
        padding: 0px;



    }

    .para {
        color: lightslategrey;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .button {
        box-sizing: border-box;
        color: rgb(0, 83, 139);
        background-color: rgb(191, 226, 250);
        display: block;
        margin: 0 auto;
        border: none;
        padding: 12px 28px;
        border-radius: 20px;
        font-size: 15px;
        
    }
    .button2{
        margin: 5px;
        padding: 10px;
        
    }
    .button2 button{
        cursor: pointer;
    }
    .button2 button:hover{
        background-color: rgb(255, 208, 208);
        color: brown;
    }
</style>

<body>

    <div class="card">
        <div class="image">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Convex_lens_%28magnifying_glass%29_and_upside-down_image.jpg"
                alt="img" width="281px">
        </div>

        <div class="tag">
            <div class="inline">
                Nature
            </div>
            <div class="inline">
                Lake
            </div>
        </div>

        <h2 class="head">
            Lorem, ipsum dolor
        </h2>
        <div class="para">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Earum aperiam, iusto nostrum soluta accusamus obcaecati perspiciatis cum laudantium aut maxime rerum, qui voluptas ex reiciendis!.
        </div>
        <div class="button2">
            <button class="button">
                continue
            </button>
        </div>

    </div>
</body>

</html>
