<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body ondragstart="return false;" ondrop="return false;">
<div class="container">

    <header class="header">
        <div>
            <div class="hamburger">
                <img class="logo-svg" src="assets/logo.svg" alt="">
            </div>

        </div>
        <input class="search" type="text" placeholder="Search">
        <div class="account"><img class="account-logo-image" src="assets/account logo image.png" alt=""></div>
    </header>

    <aside id="side-bar" class="sidebar">
        <div class="sidebar-title">Your Library</div>
        <div class="sidebar-songs">
            <!-- Song-name-card will be written here by java script -->
        </div>
    </aside>
    <main class="songs">
        <h1 class="title">Playlists</h1>
        <div class="playlist-cards">
            <!-- cards will be written here by java script -->
        </div>
    </main>
    <footer class="footer-panal">
        <div class="playing-song">
            <div class="playing-song-card">
                <h2 class="trackNameForPlayer"></h2>
                <div class="trackDetailForPlayer"></div>
            </div>
        </div>
        <div class="player">
            <div class="seekbar">
                <div class="progress-bar">
                    <div class="circle"></div>
                </div>

            </div>
            <div class="player-details">

                <div class="control-panal">
                    <div class="direction-btn">
                        <img id="back" src="assets/Control Buttons/play-backward.svg" class="control-btn" alt=""
                            width="30px" height="30px">
                    </div>
                    <div class="pause-btn-background">
                        <img id="play" src="assets/Control Buttons/play-button.svg" class="control-btn btn" alt=""
                            width="50px" height="50px">
                    </div>
                    <div class="direction-btn">
                        <img id="forward" src="assets/Control Buttons/play-backward.svg"
                            class="control-btn backward-btn" alt="" width="30px" height="30px">
                    </div>
                </div>

            </div>
        </div>
        <div>
            <div class="duration"></div>
            <div class="volume">
                <div class="range">
                    <input class="volume-input" type="range" name="volume">
                </div>
                <img class="volume-svg" src="assets/volume.svg" alt="">
            </div>

        </div>

    </footer>
</div>


    <script src="javascript/script.js" defer></script>
</body>

</html>
